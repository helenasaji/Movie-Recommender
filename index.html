<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayalam Movie Recommender</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel to compile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [search, setSearch] = useState("");
            const [results, setResults] = useState([]);
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const getRecommendations = async () => {
                if (!search) return;
                setLoading(true);
                setError("");
                setResults([]);

                try {
                    // Call your Python FastAPI backend
                    const response = await fetch(`/api/recommend?movie=${encodeURIComponent(search)}`);
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || "Movie not found");
                    }
                    setResults(data.recommendations);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div class="max-w-2xl mx-auto pt-16">
                    <h1 class="text-4xl font-bold mb-2 text-center text-blue-400">Malayalam Movie Recommender</h1>
                    <p class="text-center text-gray-400 mb-8">Powered by Machine Learning</p>
                    
                    <div class="flex gap-4 mb-8">
                        <input 
                            type="text" 
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            placeholder="Enter a Malayalam movie (e.g., Premam)"
                            class="flex-1 p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-blue-500"
                        />
                        <button 
                            onClick={getRecommendations}
                            disabled={loading}
                            class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-semibold transition disabled:opacity-50"
                        >
                            {loading ? "Searching..." : "Recommend"}
                        </button>
                    </div>

                    {error && <div class="bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-lg mb-6">{error}</div>}

                    <div class="grid gap-4">
                        {results.map((movie, index) => (
                            <div key={index} class="bg-gray-800 p-4 rounded-lg border border-gray-700 hover:border-gray-500 transition">
                                <h3 class="text-xl font-medium">{movie.title}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
